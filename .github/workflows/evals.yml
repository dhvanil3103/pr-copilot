name: Evals

# Manual only: evals call the real Anthropic API and cost money.
on:
  workflow_dispatch:
    inputs:
      default_model:
        description: Model for both agents (empty keeps the app default)
        required: false

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.7.19"
          enable-cache: true
      - run: uv sync --frozen
      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEFAULT_MODEL: ${{ inputs.default_model || 'claude-haiku-4-5' }}
        run: uv run python -m evals.run
      - uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: evals/reports/*.md
          if-no-files-found: warn
