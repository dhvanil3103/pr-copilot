# Applied once by a cluster admin (docs/DEPLOY_EKS.md), not by the Helm chart:
# StorageClasses are cluster-scoped, and the CI deploy role is limited to the app namespace.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  # Tag EBS volumes so leftovers are easy to find (see scripts/teardown.sh).
  tagSpecification_1: "project=pr-copilot"
# Delete, so removing a PVC also deletes its EBS volume and stops the billing.
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
