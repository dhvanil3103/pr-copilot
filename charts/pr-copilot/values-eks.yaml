# Production on EKS. The deploy workflow sets image.tag to the commit SHA.
image:
  registry: ghcr.io/dhvanil3103

config:
  # Claude through Bedrock; the worker's role comes from infra/terraform/bedrock.tf.
  llmProvider: bedrock
  awsRegion: us-east-1
  defaultModel: us.anthropic.claude-opus-4-5-20251101-v1:0
  # Matches the account's current Bedrock quota; remove once the increase is approved.
  llmRequestsPerMinute: "5"

persistence:
  # Created once by an admin from infra/k8s/gp3-storageclass.yaml.
  storageClassName: gp3

ingress:
  enabled: true
  className: nginx
  host: ""
  tls:
    # Needs a host and cert-manager with a ClusterIssuer; see docs/DEPLOY_EKS.md.
    enabled: false
