apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "pr-copilot.fullname" . }}-config
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  KAFKA_BOOTSTRAP_SERVERS: "{{ include "pr-copilot.kafkaHeadless" . }}:9092"
  KAFKA_PARTITIONS: {{ .Values.kafka.partitions | quote }}
  GITHUB_API_URL: {{ .Values.config.githubApiUrl | quote }}
  ANTHROPIC_BASE_URL: {{ .Values.config.anthropicBaseUrl | quote }}
  DEFAULT_MODEL: {{ .Values.config.defaultModel | quote }}
  REVIEW_AGENT_MODEL: {{ .Values.config.reviewAgentModel | quote }}
  TEST_AGENT_MODEL: {{ .Values.config.testAgentModel | quote }}
  MAX_INLINE_COMMENTS: {{ .Values.config.maxInlineComments | quote }}
  WORKER_MAX_ATTEMPTS: {{ .Values.config.workerMaxAttempts | quote }}
