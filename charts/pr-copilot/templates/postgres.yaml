apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pr-copilot.postgresHost" . }}
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "pr-copilot.postgresHost" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pr-copilot.selectorLabels" (list . "postgres") | nindent 6 }}
  {{- if .Values.persistence.deleteOnUninstall }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "pr-copilot.selectorLabels" (list . "postgres") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70  # postgres user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args:
            - "-c"
            - "shared_buffers={{ .Values.postgres.sharedBuffers }}"
            - "-c"
            - "max_connections={{ .Values.postgres.maxConnections }}"
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: prcopilot }
            - { name: POSTGRES_DB, value: prcopilot }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password }
            # A subdirectory, because a fresh EBS volume has lost+found at its root.
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "prcopilot"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "prcopilot"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
      volumes:
        - { name: run, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pr-copilot.postgresHost" . }}
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pr-copilot.selectorLabels" (list . "postgres") | nindent 4 }}
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
