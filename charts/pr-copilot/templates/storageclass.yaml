{{- if .Values.storageClass.create }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storageClass.name }}
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
  # Tag EBS volumes so leftovers are easy to find (see scripts/teardown.sh).
  tagSpecification_1: "project=pr-copilot"
# Delete, so removing a PVC also deletes its EBS volume and stops the billing.
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
{{- end }}
