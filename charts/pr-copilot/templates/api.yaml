apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pr-copilot.fullname" . }}-api
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "pr-copilot.selectorLabels" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pr-copilot.selectorLabels" (list . "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      {{- include "pr-copilot.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "pr-copilot.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "pr-copilot.image" (list . .Values.image.api) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: {{ include "pr-copilot.fullname" . }}-config }
          env:
            {{- include "pr-copilot.databaseEnv" . | nindent 12 }}
            - name: GITHUB_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: github-webhook-secret }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          startupProbe:
            # The API creates Kafka topics on startup, which waits for the broker.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 36
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "pr-copilot.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pr-copilot.fullname" . }}-api
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "pr-copilot.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
