apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pr-copilot.fullname" . }}-kafka
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ include "pr-copilot.kafkaHeadless" . }}
  replicas: 1  # single broker in KRaft mode (combined broker and controller)
  selector:
    matchLabels:
      {{- include "pr-copilot.selectorLabels" (list . "kafka") | nindent 6 }}
  {{- if .Values.persistence.deleteOnUninstall }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "pr-copilot.selectorLabels" (list . "kafka") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # appuser in the apache/kafka image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - { name: client, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: CLUSTER_ID, value: {{ .Values.kafka.clusterId | quote }} }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            # Clients bootstrap through the headless Service, then connect to this stable pod DNS name.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).{{ include "pr-copilot.kafkaHeadless" . }}.$(POD_NAMESPACE).svc.cluster.local:9092"
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: {{ .Values.kafka.heapOpts | quote }} }
          readinessProbe:
            tcpSocket: { port: client }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: client }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.kafka.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pr-copilot.kafkaHeadless" . }}
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Publish the pod's DNS record before it is ready, so the broker can start up.
  publishNotReadyAddresses: true
  selector:
    {{- include "pr-copilot.selectorLabels" (list . "kafka") | nindent 4 }}
  ports:
    - { name: client, port: 9092, targetPort: client }
