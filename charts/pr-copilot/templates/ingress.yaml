{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pr-copilot.fullname" . }}
  labels:
    {{- include "pr-copilot.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  {{- if not .Values.ingress.host }}
  {{- fail "ingress.tls.enabled requires ingress.host" }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: {{ include "pr-copilot.fullname" . }}-api, port: { name: http } }
          - path: /webhooks
            pathType: Prefix
            backend:
              service: { name: {{ include "pr-copilot.fullname" . }}-api, port: { name: http } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: {{ include "pr-copilot.fullname" . }}-frontend, port: { name: http } }
{{- end }}
