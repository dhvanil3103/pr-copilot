services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: prcopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prcopilot}
      POSTGRES_DB: prcopilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prcopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    # Single broker in KRaft mode (no ZooKeeper). Two listeners: one for
    # containers (kafka:9092) and one for tools on the host (localhost:9094).
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["9094:9094"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s

  migrate:
    build: { context: ., dockerfile: api/Dockerfile }
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://prcopilot:${POSTGRES_PASSWORD:-prcopilot}@postgres:5432/prcopilot
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://prcopilot:${POSTGRES_PASSWORD:-prcopilot}@postgres:5432/prcopilot
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: worker/Dockerfile }
    env_file: [.env]
    environment:
      <<: *app-env
      WORKER_RETRY_BASE_SECONDS: "2"
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

volumes:
  pgdata:
